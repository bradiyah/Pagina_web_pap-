<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Claro / Oscuro</title>
    <style>
 body {
    background-color: white;
    color: black;
}
.dark-mode {
    background-color: black;
    color: white;
}
    </style>
    <script>
        function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
    }
        
    </script>
</head>
<body>
    <button class="toggle-button" onclick="toggleDarkMode()">🌙 Modo Oscuro</button>
    <h1>Modo Claro / Oscuro</h1>
    <p>Este es un ejemplo de cómo cambiar el color de fondo y el color del texto de una página web.</p>
</body>
</html>
